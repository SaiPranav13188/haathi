# Optional services. Haathi runs without Docker (in-process Qdrant); use these for a persistent Qdrant
# server (HAATHI_VECTOR_STORE=qdrant-server) or Langfuse tracing (HAATHI_LANGFUSE_ENABLED=true).
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["./data/qdrant:/qdrant/storage"]

  langfuse-db:
    image: postgres:16-alpine
    profiles: ["tracing"]
    environment: { POSTGRES_USER: langfuse, POSTGRES_PASSWORD: langfuse, POSTGRES_DB: langfuse }
    volumes: ["./data/langfuse-db:/var/lib/postgresql/data"]

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["tracing"]
    depends_on: [langfuse-db]
    ports: ["3001:3000"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: change-me
      SALT: change-me
      NEXTAUTH_URL: http://localhost:3001

  backend:
    build: ./backend
    profiles: ["full"]
    ports: ["8000:8000"]
    env_file: [backend/.env]
    volumes: ["./data:/app/data"]
