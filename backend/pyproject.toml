[project]
name = "haathi-backend"
version = "0.1.0"
description = "Haathi: multilingual RAG assistant for Indian government schemes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=0.2.60",
    "bm25s>=0.2.6",
    "numpy>=1.26",
    "qdrant-client>=1.12",
    "google-genai>=1.0",
    "rapidfuzz>=3.9",
    "indic-transliteration>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "truststore>=0.10.5",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Heavy models: BGE-M3 (dense + sparse), bge-reranker-v2-m3, Docling. Runs on Apple Silicon via MPS.
ml = [
    "torch>=2.4",
    "FlagEmbedding>=1.3",
    # transformers 5.x silently breaks bge-reranker-v2-m3 (every score ~0); FlagEmbedding targets 4.x
    "transformers>=4.44,<5",
    "docling>=2.10",
]
observability = ["langfuse>=2.50,<3"]
loadtest = ["locust>=2.31"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
